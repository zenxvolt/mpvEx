name: Build APK

on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'website/**'
      - 'fastlane/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew assembleStandardPreview --stacktrace

      # Keeps the fallback signing key between runs, so a newer build can be
      # installed over an older one when no signing secrets are configured.
      - name: Restore fallback keystore
        uses: actions/cache@v4
        with:
          path: ~/fallback-keystore
          key: fallback-keystore-v1

      - name: Sign APKs
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PREVIEW_DIR="app/build/outputs/apk/standard/preview"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "Signing with the repository signing key"
            echo "$SIGNING_KEYSTORE" | base64 -d > release.keystore
            KS="release.keystore"
            ALIAS="$SIGNING_KEY_ALIAS"
            STORE_PASS="$SIGNING_STORE_PASSWORD"
            KEY_PASS="$KEY_PASSWORD"
          else
            echo "::warning::No SIGNING_KEYSTORE secret found, signing with a fallback key"
            mkdir -p ~/fallback-keystore
            KS="$HOME/fallback-keystore/fallback.keystore"
            ALIAS="mpvex"
            STORE_PASS="android"
            KEY_PASS="android"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
                -dname "CN=mpvEx CI"
            fi
          fi

          shopt -s nullglob
          apks=("$PREVIEW_DIR"/app-standard-*-preview-unsigned.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No unsigned preview APK files found"
            find app/build/outputs -name "*.apk" -type f
            exit 1
          fi

          for apk in "${apks[@]}"; do
            aligned="${apk%.apk}-aligned.apk"
            signed="${apk/-unsigned/}"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "$aligned"
            "$APKSIGNER" sign \
              --ks "$KS" \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$STORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "$signed" \
              "$aligned"
            "$APKSIGNER" verify "$signed"
            rm "$apk" "$aligned"
          done

          rm -f release.keystore
          ls -lh "$PREVIEW_DIR"

      - name: Prepare artifacts
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          echo "SHORT_SHA=$SHORT_SHA" >> "$GITHUB_ENV"
          mkdir -p output
          for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
            src="app/build/outputs/apk/standard/preview/app-standard-${abi}-preview.apk"
            if [ -f "$src" ]; then
              cp "$src" "output/mpvEx-${abi}-${SHORT_SHA}.apk"
            fi
          done
          ls -lh output

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-arm64-v8a-${{ env.SHORT_SHA }}
          path: output/mpvEx-arm64-v8a-${{ env.SHORT_SHA }}.apk
          if-no-files-found: error

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-universal-${{ env.SHORT_SHA }}
          path: output/mpvEx-universal-${{ env.SHORT_SHA }}.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-armeabi-v7a-${{ env.SHORT_SHA }}
          path: output/mpvEx-armeabi-v7a-${{ env.SHORT_SHA }}.apk
          if-no-files-found: warn

      - name: Upload x86 APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-x86-${{ env.SHORT_SHA }}
          path: output/mpvEx-x86-${{ env.SHORT_SHA }}.apk
          if-no-files-found: warn

      - name: Upload x86_64 APK
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-x86_64-${{ env.SHORT_SHA }}
          path: output/mpvEx-x86_64-${{ env.SHORT_SHA }}.apk
          if-no-files-found: warn
